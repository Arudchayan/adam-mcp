name: Release candidate

on:
  workflow_dispatch:
  workflow_call:
  # Home of the exhaustive 3-OS x 2-Node cross-platform sweep, so that
  # per-commit CI can stay small without losing coverage. Runs on every
  # release tag and on a weekly schedule.
  push:
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check

  artifact:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack the verified source and record artifact evidence
        run: npm run release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: adam-mcp-release-candidate
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
