name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version approved for publication
        type: string
        required: true
      security_checklist_complete:
        description: All SECURITY.md gates, client walkthrough and independent reviews are complete
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main' && inputs.security_checklist_complete
    uses: ./.github/workflows/release-candidate.yml

  publish:
    needs: candidate
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: adam-mcp-release-candidate
          path: .release
      - name: Check approved version, source and artifact checksum
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm run release:verify
      - name: Publish the verified tarball with npm OIDC
        run: npm publish .release/adam-mcp-*.tgz --access public --ignore-scripts --registry=https://registry.npmjs.org
      - name: Verify published integrity
        run: npm run release:verify -- --published
